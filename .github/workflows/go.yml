name: Build and Deploy

on:
  push:
    branches:
      - main
jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v3

      - uses: actions/setup-go@v4
        with:
          go-version: 1.21

      - name: Test
        run: make test article-index-test

      - name: Build
        run: make index

      - name: Verify generated article
        run: make article-index-check
        
      - name: Commit and push changes with Git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html docs/benchmarks
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "chore: build and deploy to GitHub Pages"
          git push
